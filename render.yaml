# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Dashboard: New → Blueprint → pick this repo → Apply.
# Everything below is read from here, so there are no fields to fill in by hand.
#
# Environment variables are deliberately not declared yet. Nothing in the app
# reads them, and an unset `sync: false` variable is one more thing that can
# stop an Apply. Add them in the dashboard when they exist:
#   VITE_CONVEX_URL        once `npx convex dev` prints it
#   VITE_ORCHESTRATOR_URL  once Pavle's service is up
#

services:
  - type: web
    name: shader-arena
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Single-page app: serve index.html for any path that is not a real file.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Prompt in, three rounds out. claude-cli cannot authenticate in a container,
  # so the published service runs LLM_PROVIDER=anthropic. Secrets are set in the
  # dashboard, not here.
  - type: web
    name: shader-arena-orchestrator
    runtime: node
    rootDir: orchestrator
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # xai is the partner model and the default for the published service.
      # Switch to anthropic in the dashboard if Grok vision does not hold up.
      # The CLI defaults to local so an iteration cannot take the site down.
      # The deployed service is the one path that must use sandboxes and Convex.
      - key: RUN_MODE
        value: convex
      - key: LLM_PROVIDER
        value: xai
      - key: DAYTONA_SNAPSHOT
        value: shader-arena-harness
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: DAYTONA_API_KEY
        sync: false
      - key: CONVEX_URL
        sync: false
